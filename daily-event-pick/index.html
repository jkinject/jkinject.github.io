<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>줍줍노트 · 경품 이벤트 목록</title>
<meta name="description" content="지금 응모할 수 있는 경품 이벤트를 마감 빠른 순으로 한 줄씩 정리했습니다. 매일 오전 8시 업데이트 · @daily.event.pick">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="줍줍노트 · 경품 이벤트 목록">
<meta property="og:description" content="지금 응모할 수 있는 경품 이벤트를 마감 빠른 순으로. 한 줄에 하나, 눌러서 바로 응모.">
<meta property="og:image" content="https://jkinject.github.io/daily-event-pick/assets/og.png">
<meta property="og:url" content="https://jkinject.github.io/daily-event-pick/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23191B1F'/%3E%3Cpath d='M21 26h22l-2.5 19h-17z' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M26 26v-4a6 6 0 0 1 12 0v4' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  @font-face{
    font-family:'Pretendard';
    src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
    font-weight:45 920; font-style:normal; font-display:swap;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:#fff; color:#191b1f;
    font-family:'Pretendard',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    font-size:15px; line-height:1.5; letter-spacing:-0.012em;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit; text-decoration:none}
  button{font:inherit; color:inherit}
  :focus-visible{outline:2px solid #191b1f; outline-offset:2px; border-radius:4px}
  .wrap{max-width:720px; margin:0 auto; padding:0 18px}

  /* header */
  .top{border-bottom:1px solid #eceef1}
  .top .wrap{display:flex; align-items:center; justify-content:space-between; gap:10px; height:54px}
  .brand{display:flex; align-items:baseline; gap:7px; font-size:16px; font-weight:700; letter-spacing:-0.03em}
  .brand span{font-size:12px; font-weight:400; color:#8f949a; letter-spacing:0}
  .ig{font-size:12.5px; color:#6f747a; white-space:nowrap}
  .ig:hover{color:#191b1f}

  /* intro */
  .lede{padding:26px 0 4px}
  .lede h1{margin:0; font-size:19px; font-weight:700; letter-spacing:-0.035em; line-height:1.35}
  .lede p{margin:5px 0 0; font-size:13px; color:#7b8087; letter-spacing:0}

  /* filter bar */
  .bar{position:sticky; top:0; z-index:10; margin-top:18px; background:#fff; border-bottom:1px solid #eceef1}
  .bar .wrap{display:flex; align-items:center; justify-content:space-between; gap:10px; height:44px}
  .tabs{display:flex; gap:16px; min-width:0}
  .tabs button{
    position:relative; height:44px; padding:0; border:0; background:none; cursor:pointer;
    font-size:13.5px; font-weight:500; color:#787d83; letter-spacing:0; white-space:nowrap;
  }
  .tabs button:hover{color:#4a4f55}
  .tabs button[aria-selected="true"]{color:#191b1f; font-weight:600}
  .tabs button[aria-selected="true"]::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:#191b1f}
  .tabs .n{margin-left:3px; font-size:12px; font-weight:400; color:#a8adb3}
  .sort{padding:6px 0; border:0; background:none; cursor:pointer; font-size:12.5px; color:#787d83; letter-spacing:0; white-space:nowrap}
  .sort:hover{color:#191b1f}

  /* list */
  .list{padding:0 0 4px}
  .row{
    display:flex; align-items:center; gap:12px;
    padding:11px 2px; border-bottom:1px solid #f2f3f5;
    transition:background .1s linear;
  }
  a.row:hover, a.row:active, div.row:hover{background:#fafbfc}
  .dd{
    flex:0 0 42px; font-size:11.5px; font-weight:600; color:#93989e; letter-spacing:0;
    font-variant-numeric:tabular-nums;
  }
  .dd.hot{color:#d33a2c}
  .main{flex:1 1 auto; min-width:0}
  .t{
    display:block; font-size:14.5px; font-weight:500; color:#191b1f; word-break:keep-all;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .t em{font-style:normal; font-weight:400; font-size:13px; color:#75797f; margin-left:4px}
  .m{
    display:flex; align-items:baseline; margin-top:2px; font-size:12.5px; font-weight:400; color:#6f747a;
    letter-spacing:0; min-width:0; white-space:nowrap;
  }
  .m .p{min-width:0; overflow:hidden; text-overflow:ellipsis}
  .m .u{flex:0 0 auto; color:#94999f}
  .m b{font-weight:500; color:#4d5257}
  .m i{font-style:normal; color:#d6d9dd; margin:0 3px}
  .act{flex:0 0 auto; font-size:12.5px; font-weight:500; color:#191b1f; letter-spacing:0; white-space:nowrap}
  .act span{color:#9aa0a6; font-weight:400}
  .acts{flex:0 0 auto; display:flex; gap:6px}
  .acts a{
    font-size:12px; font-weight:500; color:#191b1f; letter-spacing:0; white-space:nowrap;
    padding:4px 8px; border:1px solid #e4e6ea; border-radius:6px;
  }
  .acts a:hover{background:#f4f5f7}
  .row.out{opacity:.42}
  .row.out .act{color:#93989e}

  .more{display:flex; flex-wrap:wrap; gap:16px; padding:12px 0 0}
  .more[hidden]{display:none}
  .more button{
    padding:4px 0; border:0; background:none; cursor:pointer;
    font-size:12.5px; color:#787d83; letter-spacing:0;
    text-decoration:underline; text-underline-offset:3px; text-decoration-color:#d6d9dd;
  }
  .more button:hover{color:#191b1f}
  .empty{padding:34px 0; font-size:13.5px; color:#93989e; text-align:center}
  .err{padding:30px 0; font-size:13.5px; color:#787d83; text-align:center; line-height:1.7}

  /* footer */
  .foot{margin-top:26px; padding:18px 0 calc(34px + env(safe-area-inset-bottom)); border-top:1px solid #eceef1}
  .foot p{margin:0; font-size:11.5px; line-height:1.75; color:#979ca2; letter-spacing:0}
  .foot p + p{margin-top:4px}
  .foot a{color:#7c8187; text-decoration:underline; text-underline-offset:2px; text-decoration-color:#dcdfe3}

  @media (max-width:480px){
    .wrap{padding:0 16px}
    .tabs{gap:13px}
    .tabs .n{display:none}
    .row{gap:9px; padding:10px 0}
    .dd{flex:0 0 34px; font-size:11px; letter-spacing:-0.02em}
    .t{white-space:normal; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-height:1.34}
    .t em{margin-left:3px}
    .act{font-size:12px; color:#b9bdc3; align-self:flex-start; margin-top:3px}
    .act .lbl{display:none}
    .row.out .act{color:#b9bdc3}
    .acts a{padding:4px 7px; font-size:11.5px}
  }
  @media (min-width:721px){
    .row{padding:12px 4px}
    .t{font-size:15px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">줍줍노트 <span>경품 이벤트</span></div>
    <a class="ig" id="igTop" href="https://www.instagram.com/daily.event.pick/" target="_blank" rel="noopener">@daily.event.pick</a>
  </div>
</header>

<main class="wrap">
  <section class="lede">
    <h1>지금 응모할 수 있는 경품</h1>
    <p>행을 누르면 기관 응모 페이지가 새 창으로 열립니다.</p>
  </section>
</main>

<div class="bar">
  <div class="wrap">
    <nav class="tabs" id="tabs" role="tablist" aria-label="목록 필터">
      <button role="tab" data-f="all" aria-selected="true">전체 <span class="n" id="nAll"></span></button>
      <button role="tab" data-f="soon" aria-selected="false">마감임박 <span class="n" id="nSoon"></span></button>
      <button role="tab" data-f="new" aria-selected="false">오늘 추가 <span class="n" id="nNew"></span></button>
    </nav>
    <button class="sort" id="sortBtn" type="button">마감임박순 ↕</button>
  </div>
</div>

<main class="wrap">
  <div class="list" id="list" aria-live="polite">
    <p class="empty">불러오는 중…</p>
  </div>
  <div class="more" id="more" hidden>
    <button type="button" id="moreBtn" hidden></button>
    <button type="button" id="outBtn" hidden></button>
  </div>
  <footer class="foot">
    <p id="note">경품·마감은 기관 공지 기준이며 변동될 수 있습니다. 응모는 각 기관 페이지에서 진행됩니다.</p>
    <p id="stamp"></p>
  </footer>
</main>

<noscript><div class="wrap"><p class="err">목록을 보려면 자바스크립트를 켜 주세요.</p></div></noscript>

<script>
(function () {
  var WD = ['일','월','화','수','목','금','토'];
  var DATA_URL = './data/events.json';
  var SOON_DAYS = 3;            // D-3 이하를 '마감임박'으로 봄
  var LIMIT = 600;              // 목록 최대 표시 수 (안전장치)

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function esc(t){
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // 오늘 날짜(KST) — 'YYYY-MM-DD'
  var now = new Date();
  var kst = new Date(now.getTime() + now.getTimezoneOffset() * 60000 + 9 * 3600000);
  var TODAY = kst.getFullYear() + '-' + pad(kst.getMonth() + 1) + '-' + pad(kst.getDate());

  function ymd(s){ return String(s == null ? '' : s).slice(0, 10); }
  function utc(s){
    var p = ymd(s).split('-');
    return Date.UTC(+p[0], (+p[1] || 1) - 1, +p[2] || 1);
  }
  function diff(a, b){ return Math.round((utc(a) - utc(b)) / 86400000); }
  function md(s){
    var p = ymd(s).split('-');
    if (p.length < 3) return '';
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    return (+p[1]) + '.' + pad(+p[2]) + '(' + WD[d.getUTCDay()] + ')';
  }
  function stamp(t){
    var d = new Date(t);
    if (isNaN(d)) return '';
    var k = new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 9 * 3600000);
    return '업데이트 ' + k.getFullYear() + '.' + pad(k.getMonth() + 1) + '.' + pad(k.getDate()) +
      ' ' + pad(k.getHours()) + ':' + pad(k.getMinutes());
  }

  var PAGE = 60;                // 처음에 보여줄 행 수 (더 보기로 60씩 추가)
  var STATE = { filter: 'all', sort: 'deadline', showOut: false, limit: PAGE };
  var ALL = [];

  // days[] 를 한 줄 목록으로 펼치고, 같은 이벤트는 최근 등록분만 남긴다
  function flatten(data){
    var rows = [], seen = {};
    var days = (data.days || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });

    function push(ev, added){
      if (!ev) return;
      var key = ev.id || ev.url || ((ev.org || '') + '|' + (ev.title || ''));
      if (!key) return;
      var row = { ev: ev, added: ymd(added) || '' };
      var prev = seen[key];
      if (prev != null && (rows[prev].added || '') > row.added) return;  // 기존이 더 최신
      row.n = ymd(ev.deadline) ? diff(ev.deadline, TODAY) : null;
      if (prev != null) { rows[prev] = row; return; }
      seen[key] = rows.length;
      rows.push(row);
    }

    days.forEach(function (day) {
      (day.events || []).forEach(function (ev) { push(ev, day.date); });
    });
    // 최상위 events[] 도 지원 (평면 배열로 쌓이는 경우)
    (data.events || []).forEach(function (ev) { push(ev, ev.added || ev.registered || ev.date); });

    return rows;
  }

  function isOut(r){ return r.n != null && r.n < 0; }
  function visible(){
    var rows = ALL.filter(function (r) {
      if (STATE.filter === 'soon') return r.n != null && r.n >= 0 && r.n <= SOON_DAYS;
      if (STATE.filter === 'new') return r.added === TODAY && !isOut(r);
      return !isOut(r);
    });
    rows.sort(STATE.sort === 'new'
      ? function (a, b) { return (a.added < b.added ? 1 : a.added > b.added ? -1 : 0) || ((a.n == null ? 9e9 : a.n) - (b.n == null ? 9e9 : b.n)); }
      : function (a, b) { return (a.n == null ? 9e9 : a.n) - (b.n == null ? 9e9 : b.n); });
    return rows;
  }

  function ddayText(r){
    if (r.n == null) return '–';
    if (r.n < 0) return '마감';
    if (r.n === 0) return 'D-DAY';
    return 'D-' + r.n;
  }
  function shortLabel(label, fallback){
    var s = String(label || '').replace(/\s*(바로\s*)?(응모하기|참여하기|도\s*참여하기|바로가기)\s*$/,'').trim();
    return s || fallback;
  }

  function rowHTML(r){
    var ev = r.ev;
    var out = isOut(r);
    var open = '<span class="dd' + (!out && r.n != null && r.n <= SOON_DAYS ? ' hot' : '') + '">' + ddayText(r) + '</span>';
    var head = '<span class="t" title="' + esc(ev.title || '') + '">' + esc(ev.title || '(제목 없음)') +
      (ev.org ? '<em>' + esc(ev.org) + '</em>' : '') + '</span>';
    var pz = ev.prize
      ? '<span class="p"><b>' + esc(ev.prize) + '</b>' + (ev.winners ? ' ' + esc(ev.winners) : '') + '</span>'
      : '';
    var un = ev.deadline ? '<span class="u">~' + md(ev.deadline) + '</span>' : '';
    var meta = '<span class="m">' + pz + (pz && un ? '<i>·</i>' : '') + un + '</span>';
    var main = '<span class="main">' + head + meta + '</span>';

    if (ev.url2) {
      return '<div class="row' + (out ? ' out' : '') + '">' + open + main +
        '<span class="acts">' +
          '<a href="' + esc(ev.url || '#') + '" target="_blank" rel="noopener noreferrer">' +
            esc(shortLabel(ev.url_short || ev.url_label, '차관급')) + ' →</a>' +
          '<a href="' + esc(ev.url2) + '" target="_blank" rel="noopener noreferrer">' +
            esc(shortLabel(ev.url2_short || ev.url2_label, '장관급')) + ' →</a>' +
        '</span></div>';
    }
    return '<a class="row' + (out ? ' out' : '') + '" href="' + esc(ev.url || '#') + '" target="_blank" rel="noopener noreferrer">' +
        open + main +
        '<span class="act">' + (out ? '마감' : '<span class="lbl">응모 </span><span>→</span>') + '</span>' +
      '</a>';
  }

  function render(){
    var list = document.getElementById('list');
    var rows = visible();
    var shown = rows.slice(0, STATE.limit);

    // 카운트
    var active = 0, soon = 0, fresh = 0;
    ALL.forEach(function (r) {
      if (!isOut(r)) {
        active++;
        if (r.n != null && r.n <= SOON_DAYS) soon++;
        if (r.added === TODAY) fresh++;
      }
    });
    document.getElementById('nAll').textContent = active;
    document.getElementById('nSoon').textContent = soon;
    document.getElementById('nNew').textContent = fresh;

    list.innerHTML = shown.length
      ? shown.map(rowHTML).join('')
      : '<p class="empty">해당하는 이벤트가 없습니다.</p>';

    // 더 보기 — 남은 행이 있을 때만
    var more = document.getElementById('more');
    var btnMore = document.getElementById('moreBtn');
    var btnOut = document.getElementById('outBtn');
    var rest = rows.length - shown.length;
    btnMore.hidden = rest <= 0;
    btnMore.textContent = rest > 0 ? '더 보기 (' + rest + ')' : '';

    // 지난 이벤트(마감) 토글 — '전체' 탭에서만
    var outRows = ALL.filter(isOut).sort(function (a, b) { return b.n - a.n; });
    btnOut.hidden = !(STATE.filter === 'all' && outRows.length && rest <= 0);
    if (!btnOut.hidden) {
      btnOut.textContent = STATE.showOut ? '지난 이벤트 접기' : '지난 이벤트 ' + outRows.length + '건 보기';
    }
    if (STATE.showOut) {
      list.insertAdjacentHTML('beforeend', outRows.slice(0, LIMIT).map(rowHTML).join(''));
    }
    more.hidden = btnMore.hidden && btnOut.hidden;

    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-f') === STATE.filter));
    });
    document.getElementById('sortBtn').textContent =
      (STATE.sort === 'new' ? '최신순' : '마감임박순') + ' ↕';
  }

  function bind(){
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      b.addEventListener('click', function () {
        STATE.filter = b.getAttribute('data-f');
        STATE.showOut = false;
        STATE.limit = PAGE;
        render();
        window.scrollTo({ top: document.querySelector('.bar').offsetTop, behavior: 'smooth' });
      });
    });
    document.getElementById('sortBtn').addEventListener('click', function () {
      STATE.sort = STATE.sort === 'deadline' ? 'new' : 'deadline';
      render();
    });
    document.getElementById('moreBtn').addEventListener('click', function () {
      STATE.limit += PAGE;
      render();
    });
    document.getElementById('outBtn').addEventListener('click', function () {
      STATE.showOut = !STATE.showOut;
      render();
    });
  }

  function boot(data){
    ALL = flatten(data || {});
    var site = data.site || {};
    if (site.instagram) {
      document.getElementById('igTop').href = site.instagram;
    }
    if (site.disclaimer) {
      document.getElementById('note').textContent =
        site.disclaimer + ' 응모는 각 기관 페이지에서 진행됩니다.';
    }
    document.getElementById('stamp').textContent =
      [stamp(site.updated_at), site.handle].filter(Boolean).join(' · ');
    bind();
    render();
  }

  fetch(DATA_URL, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(boot)
    .catch(function () {
      document.getElementById('list').innerHTML =
        '<p class="err">목록을 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.</p>';
    });
})();
</script>
</body>
</html>
