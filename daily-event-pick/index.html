<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>줍줍노트 · 경품 이벤트 목록</title>
<meta name="description" content="지금 응모할 수 있는 경품 이벤트를 마감 빠른 순으로 한 줄씩 정리했습니다. 매일 오전 8시 업데이트 · @daily.event.pick">
<meta name="theme-color" content="#ffffff">
<meta property="og:type" content="website">
<meta property="og:title" content="줍줍노트 · 경품 이벤트 목록">
<meta property="og:description" content="지금 응모할 수 있는 경품 이벤트를 마감 빠른 순으로. 한 줄에 하나, 눌러서 바로 응모.">
<meta property="og:image" content="https://jkinject.github.io/daily-event-pick/assets/og.png">
<meta property="og:url" content="https://jkinject.github.io/daily-event-pick/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23191B1F'/%3E%3Cpath d='M21 26h22l-2.5 19h-17z' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cpath d='M26 26v-4a6 6 0 0 1 12 0v4' fill='none' stroke='%23fff' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  @font-face{
    font-family:'Pretendard';
    src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');
    font-weight:45 920; font-style:normal; font-display:swap;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0; background:#fff; color:#191b1f;
    font-family:'Pretendard',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
    font-size:15px; line-height:1.5; letter-spacing:-0.012em;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:inherit; text-decoration:none}
  button{font:inherit; color:inherit}
  :focus-visible{outline:2px solid #191b1f; outline-offset:2px; border-radius:4px}
  .wrap{max-width:720px; margin:0 auto; padding:0 18px}

  /* header */
  .top{border-bottom:1px solid #eceef1}
  .top .wrap{display:flex; align-items:center; justify-content:space-between; gap:10px; height:54px}
  .brand{display:flex; align-items:center; gap:6px; font-size:16px; font-weight:700; letter-spacing:-0.03em}
  .brand .mark{flex:0 0 auto; display:block; width:21px; height:21px}
  .brand .bt{display:flex; align-items:baseline; gap:7px}
  .brand .bt b{font-size:16px; font-weight:700; letter-spacing:-0.03em}
  .brand .bt span{font-size:12px; font-weight:400; color:#8f949a; letter-spacing:0}
  .ig{font-size:12.5px; color:#6f747a; white-space:nowrap}
  .ig:hover{color:#191b1f}

  /* intro */
  .lede{padding:26px 0 4px}
  .lede h1{margin:0; font-size:19px; font-weight:700; letter-spacing:-0.035em; line-height:1.35}
  .lede p{margin:5px 0 0; font-size:13px; color:#7b8087; letter-spacing:0}

  /* filter bar */
  .bar{position:sticky; top:0; z-index:10; margin-top:18px; background:#fff; border-bottom:1px solid #eceef1}
  .bar .wrap{display:flex; align-items:center; justify-content:space-between; gap:10px; height:44px}
  .tabs{display:flex; gap:16px; min-width:0; overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{
    position:relative; height:44px; padding:0; border:0; background:none; cursor:pointer;
    font-size:13.5px; font-weight:500; color:#787d83; letter-spacing:0; white-space:nowrap;
  }
  .tabs button:hover{color:#4a4f55}
  .tabs button[aria-selected="true"]{color:#191b1f; font-weight:600}
  .tabs button[aria-selected="true"]::after{content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:#191b1f}
  .tabs .n{margin-left:3px; font-size:12px; font-weight:400; color:#a8adb3}
  .sort{padding:6px 0; border:0; background:none; cursor:pointer; font-size:12.5px; color:#787d83; letter-spacing:0; white-space:nowrap}
  .sort:hover{color:#191b1f}

  /* list */
  .list{padding:0 0 4px}
  .row{
    position:relative; display:flex; align-items:center; gap:12px;
    padding:11px 2px; border-bottom:1px solid #f2f3f5;
    transition:background .1s linear;
  }
  .row:hover, .row:active{background:#fafbfc}
  /* 제목 링크가 행 전체를 덮는다 (제보 버튼만 그 위에 올라옴) */
  .t.go::after{content:''; position:absolute; inset:0; z-index:1}
  .t.go:focus-visible{outline:0}
  .t.go:focus-visible::after{outline:2px solid #191b1f; outline-offset:-2px; border-radius:4px}
  .dd{
    flex:0 0 42px; font-size:11.5px; font-weight:600; color:#93989e; letter-spacing:0;
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .dd.hot{color:#d33a2c}
  .main{flex:1 1 auto; min-width:0}
  .hd{display:flex; align-items:flex-start; gap:6px; min-width:0}
  .hd .t{flex:1 1 0%; min-width:0}
  .pick{
    flex:0 0 auto; display:inline-block; margin-top:3.5px; padding:1.5px 4px 1px; border-radius:3px;
    background:#eef4ff; color:#1a6bff; font-size:9.5px; font-weight:700;
    letter-spacing:.06em; line-height:1.25; text-indent:.06em;
  }
  .t{
    display:block; font-size:14.5px; font-weight:500; color:#191b1f; word-break:keep-all;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .t em{font-style:normal; font-weight:400; font-size:13px; color:#75797f; margin-left:4px}
  .m{
    display:block; margin-top:2px; font-size:12.5px; font-weight:400; color:#6f747a;
    letter-spacing:0; min-width:0; line-height:1.45; word-break:keep-all; overflow-wrap:anywhere;
  }
  .m .p{display:inline}
  .m .u{color:#94999f; white-space:nowrap}
  .m b{font-weight:500; color:#4d5257}
  .m .ic{
    display:inline-block; vertical-align:-3.5px;
    width:18px; height:18px; margin:0 5px 0 0; color:#8d939b;
  }
  .m .ic svg{display:block; width:18px; height:18px}
  .m i{font-style:normal; color:#d6d9dd; margin:0 3px}
  .rp{
    position:relative; z-index:2; padding:0; border:0; background:none; cursor:pointer;
    font-size:11.5px; color:#a3a8ae; white-space:nowrap;
    text-decoration:underline; text-underline-offset:2px; text-decoration-color:#dfe2e6;
  }
  .rp::before{content:''; position:absolute; inset:-9px -10px}
  .rp:hover{color:#191b1f}
  .rp.done{cursor:default; color:#b4b9bf; text-decoration:none}
  .rp.done::before{content:none}
  .tp{
    display:block; margin-top:3px; font-size:11.5px; color:#878d94;
    letter-spacing:0; line-height:1.45; word-break:keep-all; overflow-wrap:anywhere;
  }
  .tp b{
    display:inline-block; margin-right:5px; padding:0 3.5px; border:1px solid #e1e4e8; border-radius:3px;
    font-size:9px; font-weight:700; letter-spacing:.06em; line-height:1.5; color:#8d939b; vertical-align:1px;
  }
  .act{flex:0 0 auto; font-size:12.5px; font-weight:500; color:#191b1f; letter-spacing:0; white-space:nowrap}
  .act span{color:#9aa0a6; font-weight:400}
  .act.res{font-weight:400; color:#98a0a9}
  .act.res.link{font-weight:500; color:#191b1f}
  .row.nores{cursor:default}
  .row.out{opacity:.42}
  .row.out .act{color:#93989e}
  .list.closed .row.out{opacity:1}
  .list.closed .row.out .t{color:#4a4f55}
  .list.closed .row.out .dd{color:#b0362a}
  .list.closed .row.out .act{color:#b0362a}
  .list.closed .row.out .act.res{color:#98a0a9}
  .list.closed .row.out .act.res.link{color:#191b1f}

  /* 방문한 이벤트 */
  .row.is-visited,
  .row.is-visited:hover,
  .row.is-visited:active{background:#f3f5f7}
  .row.is-visited{border-bottom-color:#e8ecef}
  .row.is-visited .t{color:#7a828e}
  .row.is-visited .t em{color:#969da6}
  .row.is-visited .dd{color:#a7aeb6}
  .row.is-visited .dd.hot{color:#c9837c}
  .row.is-visited .m{color:#8b929b}
  .row.is-visited .m b{color:#7e858e}
  .row.is-visited .m i{color:#d3d8dd}
  .row.is-visited .m .ic{color:#a5acb4}
  .row.is-visited .tp{color:#9aa1a9}
  .row.is-visited .act{color:#98a0a9}
  .row.is-visited.out{opacity:.55}

  .empty{padding:34px 0; font-size:13.5px; color:#93989e; text-align:center}
  .err{padding:30px 0; font-size:13.5px; color:#787d83; text-align:center; line-height:1.7}

  /* footer */
  .foot{margin-top:26px; padding:18px 0 calc(34px + env(safe-area-inset-bottom)); border-top:1px solid #eceef1}
  .foot p{margin:0; font-size:11.5px; line-height:1.75; color:#979ca2; letter-spacing:0}
  .foot p + p{margin-top:4px}
  .foot a, .foot .lk{color:#7c8187; text-decoration:underline; text-underline-offset:2px; text-decoration-color:#dcdfe3}
  .foot .lk{padding:0; border:0; background:none; cursor:pointer; font-size:inherit; letter-spacing:0}
  .foot .lk:hover{color:#191b1f}

  /* 오류 제보 창 */
  [hidden]{display:none !important}
  dialog:not([open]){display:none}
  html.dlg-open{overflow:hidden}
  .dlg{
    position:fixed; inset:0; margin:auto; height:fit-content; max-height:calc(100% - 32px);
    width:min(420px, calc(100% - 32px)); max-width:none; padding:0; border:0; border-radius:14px;
    background:#fff; color:#191b1f; box-shadow:0 12px 40px rgba(25,27,31,.18); overflow:auto;
  }
  .dlg::backdrop{background:rgba(25,27,31,.4)}
  .dlg-in{padding:22px 22px 20px}
  .dlg h2{margin:0; font-size:17px; font-weight:700; letter-spacing:-0.03em}
  .dlg-ev{margin:6px 0 0; font-size:13px; color:#6f747a; letter-spacing:0; line-height:1.5; word-break:keep-all}
  .dlg-rs{margin:18px 0 0; padding:0; border:0; min-width:0; display:flex; flex-wrap:wrap; gap:7px}
  .dlg-rs legend, .dlg-lb{padding:0; margin:0 0 8px; font-size:12.5px; font-weight:600; color:#4d5257; letter-spacing:0}
  .dlg-rs label{position:relative; cursor:pointer}
  .dlg-rs input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
  .dlg-rs span{
    display:block; padding:7px 12px; border:1px solid #e1e4e8; border-radius:999px;
    font-size:13px; color:#4d5257; letter-spacing:0; white-space:nowrap;
  }
  .dlg-rs input:checked + span{border-color:#191b1f; background:#191b1f; color:#fff}
  .dlg-rs input:focus-visible + span{outline:2px solid #191b1f; outline-offset:2px}
  .dlg-msg{display:block; margin-top:18px}
  .dlg-lb{display:block}
  .dlg-msg textarea{
    display:block; width:100%; min-height:76px; padding:10px 12px; border:1px solid #e1e4e8; border-radius:10px;
    font:inherit; font-size:16px; line-height:1.5; color:#191b1f; letter-spacing:0; resize:vertical; background:#fff;
  }
  .dlg-msg textarea:focus{outline:0; border-color:#191b1f}
  .dlg-msg textarea::placeholder{color:#adb2b8}
  .dlg .hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0}
  .dlg-err{margin:10px 0 0; font-size:12.5px; color:#d33a2c; letter-spacing:0}
  .dlg-btns{display:flex; justify-content:flex-end; gap:8px; margin-top:18px}
  .dlg-btns button{
    height:42px; padding:0 18px; border:1px solid #e1e4e8; border-radius:10px; background:#fff; cursor:pointer;
    font-size:14px; font-weight:500; color:#4d5257; letter-spacing:0;
  }
  .dlg-btns .b1{border-color:#191b1f; background:#191b1f; color:#fff; font-weight:600}
  .dlg-btns button:disabled{opacity:.5; cursor:default}
  .dlg-done p{margin:8px 0 0; font-size:13.5px; color:#6f747a; letter-spacing:0; line-height:1.6}

  @media (max-width:480px){
    .wrap{padding:0 16px}
    .tabs{gap:13px}
    .tabs .n{margin-left:2px; font-size:11px}
    .sort{padding-left:8px}
    .row{gap:9px; padding:10px 0}
    .dd{flex:0 0 40px; font-size:11px; letter-spacing:-0.02em}
    .t{white-space:normal; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-height:1.34}
    .t em{margin-left:3px}
    .hd{gap:5px}
    .pick{margin-top:3px; padding:1px 3.5px 0.5px; font-size:9px; letter-spacing:.04em}
    .m{font-size:12px; line-height:1.5}
    .m .ic{width:17px; height:17px; margin-right:4px; vertical-align:-3px}
    .m .ic svg{width:17px; height:17px}
    .act{font-size:12.5px; color:#a2a7ad; align-self:center}
    .act .lbl{display:none}
    .row.out .act{color:#b9bdc3}
    .dlg{inset:auto 0 0 0; margin:0; width:100%; max-height:92%; border-radius:16px 16px 0 0}
    .dlg-in{padding:22px 18px calc(18px + env(safe-area-inset-bottom))}
    .dlg-btns button{flex:1 1 0; height:46px}
  }
  @media (min-width:721px){
    .row{padding:12px 4px}
    .t{font-size:15px}
  }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4.7 8.7h14.6l-1.3 11a2 2 0 0 1-2 1.8H8a2 2 0 0 1-2-1.8l-1.3-11Z" stroke="#191b1f" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M8.9 8.7V6.5a3.1 3.1 0 0 1 6.2 0v2.2" stroke="#1a6bff" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="12" cy="14.2" r="1.35" fill="#1a6bff"/>
      </svg>
      <span class="bt"><b>줍줍노트</b> <span>경품 이벤트</span></span>
    </div>
    <a class="ig" id="igTop" href="https://www.instagram.com/daily.event.pick/" target="_blank" rel="noopener">@daily.event.pick</a>
  </div>
</header>

<main class="wrap">
  <section class="lede">
    <h1 id="ledeTitle">지금 응모할 수 있는 경품</h1>
    <p id="ledeDesc">행을 누르면 기관 응모 페이지가 새 창으로 열립니다.</p>
  </section>
</main>

<div class="bar">
  <div class="wrap">
    <nav class="tabs" id="tabs" role="tablist" aria-label="목록 필터">
      <button role="tab" data-f="open" aria-selected="true">진행중 <span class="n" id="nOpen"></span></button>
      <button role="tab" data-f="soon" aria-selected="false">마감임박 <span class="n" id="nSoon"></span></button>
      <button role="tab" data-f="new" aria-selected="false">신규 <span class="n" id="nNew"></span></button>
      <button role="tab" data-f="closed" aria-selected="false">마감 <span class="n" id="nClosed"></span></button>
    </nav>
    <button class="sort" id="sortBtn" type="button">마감임박순 ↕</button>
  </div>
</div>

<main class="wrap">
  <div class="list" id="list" aria-live="polite">
    <p class="empty">불러오는 중…</p>
  </div>
  <footer class="foot">
    <p id="note">경품·마감은 기관 공지 기준이며 변동될 수 있습니다. 응모는 각 기관 페이지에서 진행됩니다.</p>
    <p>잘못된 정보나 빠진 이벤트가 있다면 <button class="lk" id="rpOpen" type="button">제보해 주세요</button>.</p>
    <p id="stamp"></p>
  </footer>
</main>

<dialog class="dlg" id="rpDlg" aria-labelledby="rpTitle">
  <form class="dlg-in" id="rpForm" novalidate>
    <h2 id="rpTitle">오류 제보</h2>
    <p class="dlg-ev" id="rpEv"></p>
    <fieldset class="dlg-rs" id="rpReasons">
      <legend>어떤 문제가 있나요?</legend>
      <label><input type="radio" name="reason" value="deadline"><span>마감일이 달라요</span></label>
      <label><input type="radio" name="reason" value="link"><span>링크가 안 열려요</span></label>
      <label><input type="radio" name="reason" value="info"><span>경품·인원이 달라요</span></label>
      <label><input type="radio" name="reason" value="ended"><span>이미 종료됐어요</span></label>
      <label><input type="radio" name="reason" value="etc"><span>기타</span></label>
    </fieldset>
    <label class="dlg-msg">
      <span class="dlg-lb" id="rpMsgLabel">자세한 내용 (선택)</span>
      <textarea id="rpMsg" name="message" maxlength="500" rows="3"></textarea>
    </label>
    <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="dlg-err" id="rpErr" role="alert" hidden></p>
    <div class="dlg-btns">
      <button type="button" id="rpCancel">취소</button>
      <button type="submit" class="b1" id="rpSend">제보하기</button>
    </div>
  </form>
  <div class="dlg-in dlg-done" id="rpDone" hidden>
    <h2>제보가 접수됐습니다</h2>
    <p>알려 주셔서 감사합니다. 확인 후 목록에 반영하겠습니다.</p>
    <div class="dlg-btns"><button type="button" class="b1" id="rpClose">닫기</button></div>
  </div>
</dialog>

<noscript><div class="wrap"><p class="err">목록을 보려면 자바스크립트를 켜 주세요.</p></div></noscript>

<script>
(function () {
  var WD = ['일','월','화','수','목','금','토'];
  var DATA_URL = './data/events.json';
  var SOON_DAYS = 1;            // 오늘·내일 마감(D-1 이하)을 '마감임박'으로 봄
  var HOT_DAYS = 3;             // D-3 이하는 D-day를 레드로 표시
  var REPORT_URL = 'https://event.lalatap.kr/api/report';   // 오류 제보 접수 (Cloudflare Worker)
  var CLOSED_DAYS = 30;         // 마감 후 30일까지만 노출

  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function esc(t){
    return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  // 오늘 날짜(KST) — 'YYYY-MM-DD'
  var now = new Date();
  var kst = new Date(now.getTime() + now.getTimezoneOffset() * 60000 + 9 * 3600000);
  var TODAY = kst.getFullYear() + '-' + pad(kst.getMonth() + 1) + '-' + pad(kst.getDate());

  function ymd(s){ return String(s == null ? '' : s).slice(0, 10); }
  function utc(s){
    var p = ymd(s).split('-');
    return Date.UTC(+p[0], (+p[1] || 1) - 1, +p[2] || 1);
  }
  function diff(a, b){ return Math.round((utc(a) - utc(b)) / 86400000); }
  function md(s){
    var p = ymd(s).split('-');
    if (p.length < 3) return '';
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    return (+p[1]) + '.' + pad(+p[2]) + '(' + WD[d.getUTCDay()] + ')';
  }
  function stamp(t){
    var d = new Date(t);
    if (isNaN(d)) return '';
    var k = new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 9 * 3600000);
    return '업데이트 ' + k.getFullYear() + '.' + pad(k.getMonth() + 1) + '.' + pad(k.getDate()) +
      ' ' + pad(k.getHours()) + ':' + pad(k.getMinutes());
  }

  var STATE = { filter: 'open', sort: 'deadline' };
  var ALL = [];
  var BYKEY = {};
  var FEATURED = {};            // 오늘 소개분(최신 featured_date) 키 모음
  var LATEST = '';              // 가장 최근 업데이트 날짜 — '신규' 탭 기준

  // 탭마다 바뀌는 상단 제목·설명
  var LEDE = {
    open: ['지금 응모할 수 있는 경품', '행을 누르면 기관 응모 페이지가 새 창으로 열립니다.'],
    soon: ['곧 마감되는 경품', '오늘·내일 마감되는 이벤트만 모았습니다.'],
    new: ['새로 올라온 경품', '가장 최근 업데이트에 추가된 이벤트입니다.'],
    closed: ['최근 30일 마감된 경품', '마감 30일 이내의 지난 이벤트만 표시됩니다.']
  };

  /* ── 방문 기록 (localStorage) ────────────────────────────── */
  var VISIT_KEY = 'visited_events_v1';
  var REPORT_KEY = 'reported_events_v1';
  var VISITED = loadMap(VISIT_KEY);
  var REPORTED = loadMap(REPORT_KEY);

  function loadMap(name){
    var m = {};
    try {
      var raw = localStorage.getItem(name);
      if (!raw) return m;
      var v = JSON.parse(raw);
      if (Array.isArray(v)) v.forEach(function (k) { if (k) m[String(k)] = 1; });
      else if (v && typeof v === 'object') Object.keys(v).forEach(function (k) { m[k] = 1; });
    } catch (e) {}
    return m;
  }
  function storeMap(name, m){
    try { localStorage.setItem(name, JSON.stringify(m)); } catch (e) {}
  }
  function markVisited(key){
    if (!key || VISITED[key]) return;
    VISITED[key] = new Date().toISOString();
    storeMap(VISIT_KEY, VISITED);
  }

  /* ── 경품 아이콘 (18×18 인라인 SVG, 이모지 없음) ─────────── */
  var SVG_OPEN = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">';
  var ICONS = {
    // 커피·음료
    coffee: SVG_OPEN +
      '<path d="M4 9.2h12v5.3A4.6 4.6 0 0 1 11.4 19h-2.8A4.6 4.6 0 0 1 4 14.5V9.2Z"/>' +

      '<path d="M5 21h10"/></svg>',
    // 상품권·페이·포인트
    giftcard: SVG_OPEN +
      '<rect x="2.6" y="5.6" width="18.8" height="12.8" rx="2.6"/>' +
      '<path d="M2.6 9.8h18.8"/>' +
      '<path d="M6.4 14.6h4.2"/>' +
      '<circle cx="17.2" cy="14.4" r="1.5"/></svg>',
    // 치킨 (닭다리)
    chicken: SVG_OPEN +
      '<path d="M14.6 3.4a6 6 0 1 1-1.2 11.9c-1-.1-1.8.2-2.5.9l-.9.9-3.1-3.1.9-.9c.7-.7 1-1.5.9-2.5a6 6 0 0 1 5.9-7.2Z" fill="currentColor" fill-opacity=".16"/>' +
      '<path d="M7.9 15 5.7 17.2a1.8 1.8 0 1 0-1.5 2.56 1.8 1.8 0 1 0 2.56-1.5L9 16.1"/></svg>',

    burger: SVG_OPEN +

      '<path d="M3.2 12.8h17.6"/>' +
      '<path d="M4.2 16.2v.8a2.4 2.4 0 0 0 2.4 2.4h10.8a2.4 2.4 0 0 0 2.4-2.4v-.8"/>' +

    tech: SVG_OPEN +

      '<path d="M10.3 5.4h3.4"/>' +
      '<path d="M10.6 18.3h2.8"/></svg>',
    // 기타 경품·생활용품
    gift: SVG_OPEN +
      '<path d="M3.6 8.8h16.8v11.2H3.6z"/>' +
      '<path d="M2.6 8.8V5.6h18.8v3.2"/>' +
      '<path d="M12 5.6v14.4"/>' +
      '<path d="M12 5.6C10.4 5.6 9 4.8 9 3.7S10.1 1.6 12 3.2c1.9-1.6 3-.5 3 .5s-1.4 1.9-3 1.9Z"/></svg>'
  };

  // 경품 문구 → 아이콘 자동 판별 (먼저 나온 키워드 우선)
  var ICON_RULES = [
    ['tech', /버즈|에어팟|에어 ?팟|갤럭시|아이패드|아이폰|애플워치|워치|노트북|태블릿|모니터|키보드|마우스|스피커|이어폰|청소기|가전|보조배터리|드론|카메라|프린터|전자/],
    ['chicken', /치킨|교촌|bbq|bhc|굽네|네네|처갓집|페리카나|푸라닭/],
    ['burger', /버거|햄버거|맥도날드|롯데리아|버거킹|맘스터치|노브랜드|베이글|샌드위치|서브웨이|피자|도미노|파파존스|핫도그|떡볶이|튀김/],
    ['coffee', /커피|아메리카노|스타벅스|투썸|메가커피|메가엠디|카페|이디야|컴포즈|할리스|파스쿠찌|커피빈|라떼|음료|주스|스무디|밀크티|버블티|공차|베이커리|빵|디저트|케이크|아이스크림|빙수/],
    ['delivery', /배달의민족|배민|요기요|쿠팡이츠|땡겨요|배달/],
    ['giftcard', /상품권|페이|포인트|기프티콘|기프트카드|온누리|다이소|올리브영|문화|쿠폰|원권|마일리지|캐시|적립|지역화폐|정책지원금/]
  ];
  var ICON_KEYS = ['tech', 'chicken', 'burger', 'coffee', 'delivery', 'giftcard', 'gift'];
  var ICON_LABEL = {
    coffee: '커피·음료', giftcard: '상품권·페이', chicken: '치킨', burger: '버거·베이커리',
    delivery: '배달', tech: '디지털 기기', gift: '기타 경품'
  };

  function iconKind(ev){
    var f = String(ev.icon || '').trim();
    if (f && ICONS[f]) return f;
    var t = String(ev.prize || '');
    var best = null, bestAt = -1;
    for (var i = 0; i < ICON_RULES.length; i++) {
      var m = t.match(ICON_RULES[i][1]);
      if (!m) continue;
      var at = t.indexOf(m[0]);
      if (best == null || at < bestAt) { best = ICON_RULES[i][0]; bestAt = at; }
    }
    return best || 'gift';
  }
  function iconHTML(ev){
    var k = iconKind(ev);
    return '<span class="ic" title="' + esc(ICON_LABEL[k] || '경품') + '" aria-hidden="true">' + (ICONS[k] || ICONS.gift) + '</span>';
  }

  // '신규' 탭 기준일 — 오늘 이전 날짜 중 가장 최근 업데이트분 (자정~업데이트 전에도 비지 않게)
  function computeLatest(rows){
    var best = '', any = '';
    rows.forEach(function (r) {
      if (!r.added) return;
      if (r.added > any) any = r.added;
      if (r.added <= TODAY && r.added > best) best = r.added;
    });
    LATEST = best || any;
  }

  // 오늘(최신 featured_date) 소개분 표시
  function computeFeatured(rows){
    FEATURED = {};
    var latest = '';
    rows.forEach(function (r) {
      var f = ymd(r.ev.featured_date);
      if (f && f > latest) latest = f;
    });
    if (!latest) return;
    var hasToday = rows.some(function (r) { return ymd(r.ev.featured_date) === TODAY; });
    if (hasToday) latest = TODAY;   // 데이터에 미래 날짜가 섞였을 때도 오늘 기준
    rows.forEach(function (r) {
      if (ymd(r.ev.featured_date) === latest) FEATURED[r.key] = 1;
    });
  }

  // days[] 를 한 줄 목록으로 펼치고, 같은 이벤트는 최근 등록분만 남긴다
  function flatten(data){
    var rows = [], seen = {};
    var days = (data.days || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });

    function push(ev, added){
      if (!ev) return;
      var key = ev.id || ev.url || ((ev.org || '') + '|' + (ev.title || ''));
      if (!key) return;
      var row = { ev: ev, added: ymd(added) || '', key: key };
      var prev = seen[key];
      if (prev != null && (rows[prev].added || '') > row.added) return;  // 기존이 더 최신
      row.n = ymd(ev.deadline) ? diff(ev.deadline, TODAY) : null;
      if (prev != null) { rows[prev] = row; return; }
      seen[key] = rows.length;
      rows.push(row);
    }

    days.forEach(function (day) {
      (day.events || []).forEach(function (ev) { push(ev, day.date); });
    });
    // 최상위 events[] 도 지원 (평면 배열로 쌓이는 경우)
    (data.events || []).forEach(function (ev) { push(ev, ev.added || ev.registered || ev.date); });

    return rows;
  }

  function isOut(r){ return r.n != null && r.n < 0; }
  function recentlyClosed(r){ return r.n != null && r.n < 0 && -r.n <= CLOSED_DAYS; }
  function cmpDeadline(a, b){ return (a.n == null ? 9e9 : a.n) - (b.n == null ? 9e9 : b.n); }
  function cmpClosed(a, b){ return (b.n == null ? -9e9 : b.n) - (a.n == null ? -9e9 : a.n); }
  function cmpAdded(a, b){
    return (a.added < b.added ? 1 : a.added > b.added ? -1 : 0) || cmpDeadline(a, b);
  }
  function visible(){
    var rows = ALL.filter(function (r) {
      if (STATE.filter === 'soon') return r.n != null && r.n >= 0 && r.n <= SOON_DAYS;
      if (STATE.filter === 'new') return !!LATEST && r.added === LATEST && !isOut(r);
      if (STATE.filter === 'closed') return recentlyClosed(r);
      return !isOut(r);
    });
    var base = STATE.sort === 'new' ? cmpAdded : (STATE.filter === 'closed' ? cmpClosed : cmpDeadline);
    var pin = STATE.filter !== 'closed';   // '마감 30일' 탭에서는 고정하지 않음
    // 고정 순서: 오늘 마감(D-DAY) → 오늘 소개분(PICK) → 나머지. 최신순에서는 PICK만 고정.
    function rank(r){
      if (STATE.sort === 'deadline' && r.n === 0) return 0;
      return FEATURED[r.key] ? 1 : 2;
    }
    rows.sort(function (a, b) {
      if (pin) {
        var ra = rank(a), rb = rank(b);
        if (ra !== rb) return ra - rb;
      }
      return base(a, b);
    });
    return rows;
  }

  function ddayText(r){
    if (r.n == null) return '–';
    if (r.n < 0) return '마감';
    if (r.n === 0) return 'D-DAY';
    return 'D-' + r.n;
  }

  function rowHTML(r){
    var ev = r.ev;
    var out = isOut(r);
    var seen = !!VISITED[r.key];
    var fresh = !!FEATURED[r.key];
    var open = '<span class="dd' + (!out && r.n != null && r.n <= HOT_DAYS ? ' hot' : '') + '">' + ddayText(r) + '</span>';
    // 제목이 곧 링크 — 진행중이면 응모 페이지, 마감이면 결과 페이지(없으면 링크 없음)
    var href = out ? (ev.result_url || '') : (ev.url || '#');
    var name = esc(ev.title || '(제목 없음)') + (ev.org ? '<em>' + esc(ev.org) + '</em>' : '');
    var head = '<span class="hd">' +
      (fresh ? '<span class="pick" title="인스타 카드뉴스에서 소개한 이벤트">PICK</span>' : '') +
      (href
        ? '<a class="t go" title="' + esc(ev.title || '') + '" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + name + '</a>'
        : '<span class="t" title="' + esc(ev.title || '') + '">' + name + '</span>') +
      '</span>';
    var pz = ev.prize
      ? '<span class="p"><b>' + esc(ev.prize) + '</b>' + (ev.winners ? ' ' + esc(ev.winners) : '') + '</span>'
      : '';
    var rp = REPORTED[r.key]
      ? '<span class="rp done">제보됨</span>'
      : '<button class="rp" type="button" aria-label="이 이벤트 오류 제보">제보</button>';
    // 마감일과 '제보'는 한 덩어리로 줄바꿈
    var un = '<span class="u">' + (ev.deadline ? '~' + md(ev.deadline) + '<i>·</i>' : '') + rp + '</span>';
    var meta = '<span class="m">' + iconHTML(ev) + pz + (pz ? '<i>·</i>' : '') + un + '</span>';
    var tip = ev.tip ? '<span class="tp"><b>TIP</b>' + esc(ev.tip) + '</span>' : '';
    var main = '<span class="main">' + head + meta + tip + '</span>';
    var cls = 'row' + (out ? ' out' : '') + (seen ? ' is-visited' : '') + (href ? '' : ' nores');

    // 마감된 이벤트: 결과 페이지가 있으면 결과보기, 없으면 링크 없는 '개별발표'
    var act = out
      ? (ev.result_url ? '<span class="act res link">결과보기 <span>→</span></span>' : '<span class="act res">개별발표</span>')
      : '<span class="act"><span class="lbl">응모 </span><span>→</span></span>';

    return '<div class="' + cls + '" data-id="' + esc(r.key) + '">' + open + main + act + '</div>';
  }

  // 클릭한 행을 즉시 방문 표시 (배경·글자 톤만 바뀜)
  function paintVisited(row){
    if (!row || row.classList.contains('is-visited')) return;
    row.classList.add('is-visited');
  }

  function render(){
    var list = document.getElementById('list');
    var rows = visible();
    var shown = rows;

    // 카운트
    var active = 0, soon = 0, fresh = 0, closed = 0;
    ALL.forEach(function (r) {
      if (!isOut(r)) {
        active++;
        if (r.n != null && r.n <= SOON_DAYS) soon++;
        if (LATEST && r.added === LATEST) fresh++;
      } else if (recentlyClosed(r)) {
        closed++;
      }
    });
    document.getElementById('nOpen').textContent = active;
    document.getElementById('nSoon').textContent = soon;
    document.getElementById('nNew').textContent = fresh;
    document.getElementById('nClosed').textContent = closed;

    list.className = 'list' + (STATE.filter === 'closed' ? ' closed' : '');
    list.innerHTML = shown.length
      ? shown.map(rowHTML).join('')
      : '<p class="empty">' + (STATE.filter === 'closed'
          ? '최근 30일 안에 마감된 이벤트가 없습니다.'
          : '해당하는 이벤트가 없습니다.') + '</p>';

    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      b.setAttribute('aria-selected', String(b.getAttribute('data-f') === STATE.filter));
    });
    var lede = LEDE[STATE.filter] || LEDE.open;
    document.getElementById('ledeTitle').textContent = lede[0];
    document.getElementById('ledeDesc').textContent = (STATE.filter === 'new' && LATEST)
      ? (LATEST === TODAY ? '오늘 추가된 이벤트만 모았습니다.' : md(LATEST) + ' 업데이트에 추가된 이벤트입니다.')
      : lede[1];
    document.getElementById('sortBtn').textContent =
      (STATE.sort === 'new' ? '최신순' : (STATE.filter === 'closed' ? '최근 마감순' : '마감임박순')) + ' ↕';
  }

  function bind(){
    Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
      b.addEventListener('click', function () {
        STATE.filter = b.getAttribute('data-f');
        render();
      });
    });
    document.getElementById('sortBtn').addEventListener('click', function () {
      STATE.sort = STATE.sort === 'deadline' ? 'new' : 'deadline';
      render();
    });
    // 행(제목 링크)을 누르면 즉시 방문 기록, '제보'를 누르면 제보 창
    document.getElementById('list').addEventListener('click', function (e) {
      var row = e.target.closest ? e.target.closest('.row') : null;
      if (!row) return;
      var key = row.getAttribute('data-id');
      if (!key) return;
      if (e.target.closest('.rp')) {
        if (!REPORTED[key] && BYKEY[key]) openReport(BYKEY[key]);
        return;
      }
      if (!e.target.closest('a.go')) return;         // 링크가 없는 마감 행은 반응하지 않음
      markVisited(key);
      paintVisited(row);
    });
    bindReport();
  }

  /* ── 오류 제보 ───────────────────────────────────────────── */
  var RP = { row: null, busy: false };
  function el(id){ return document.getElementById(id); }

  function openReport(r){
    var dlg = el('rpDlg'), ev = r ? r.ev : null;
    RP.row = r || null;
    el('rpForm').reset();
    el('rpForm').hidden = false;
    el('rpDone').hidden = true;
    el('rpErr').hidden = true;
    el('rpEv').textContent = ev
      ? (ev.title || '') + (ev.org ? ' · ' + ev.org : '')
      : '빠진 이벤트나 사이트 오류를 알려 주세요.';
    el('rpReasons').hidden = !ev;
    el('rpMsgLabel').textContent = ev ? '자세한 내용 (선택)' : '내용';
    el('rpMsg').placeholder = ev ? '예: 실제 마감일은 11월 30일이에요' : '예: ○○기관 이벤트가 빠져 있어요 (링크를 함께 적어 주세요)';
    document.documentElement.classList.add('dlg-open');
    if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
  }
  function closeReport(){
    var dlg = el('rpDlg');
    if (dlg.close) dlg.close(); else dlg.removeAttribute('open');
    document.documentElement.classList.remove('dlg-open');
  }
  function paintReported(key){
    Array.prototype.forEach.call(document.querySelectorAll('#list .row'), function (row) {
      if (row.getAttribute('data-id') !== key) return;
      var b = row.querySelector('.rp');
      if (!b) return;
      var s = document.createElement('span');
      s.className = 'rp done';
      s.textContent = '제보됨';
      b.parentNode.replaceChild(s, b);
    });
  }
  function sendReport(e){
    e.preventDefault();
    if (RP.busy) return;
    var form = el('rpForm'), err = el('rpErr'), btn = el('rpSend');
    var r = RP.row, ev = r ? r.ev : {};
    var picked = form.querySelector('input[name="reason"]:checked');
    var msg = el('rpMsg').value.trim();
    function fail(t){ err.textContent = t; err.hidden = false; }
    if (r && !picked) return fail('어떤 문제인지 골라 주세요.');
    if ((!r || picked.value === 'etc') && msg.length < 5) return fail('내용을 조금 더 자세히 적어 주세요.');
    err.hidden = true;
    RP.busy = true;
    btn.disabled = true;
    btn.textContent = '보내는 중…';
    fetch(REPORT_URL, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        id: r ? r.key : '',
        title: ev.title || '',
        org: ev.org || '',
        url: ev.url || '',
        deadline: ymd(ev.deadline),
        reason: r ? picked.value : 'etc',
        message: msg,
        page: location.host + location.pathname,
        hp: form.elements.website.value
      })
    })
      .then(function (res) {
        if (res.status === 429) throw new Error('rate');
        if (!res.ok) throw new Error('http');
        if (r) {
          REPORTED[r.key] = new Date().toISOString();
          storeMap(REPORT_KEY, REPORTED);
          paintReported(r.key);
        }
        form.hidden = true;
        el('rpDone').hidden = false;
        el('rpClose').focus();
      })
      .catch(function (x) {
        fail(x && x.message === 'rate'
          ? '제보가 많이 접수되어 잠시 쉬어 갑니다. 조금 뒤에 다시 시도해 주세요.'
          : '전송하지 못했습니다. 잠시 후 다시 시도해 주세요.');
      })
      .then(function () {
        RP.busy = false;
        btn.disabled = false;
        btn.textContent = '제보하기';
      });
  }
  function bindReport(){
    var dlg = el('rpDlg');
    el('rpOpen').addEventListener('click', function () { openReport(null); });
    el('rpCancel').addEventListener('click', closeReport);
    el('rpClose').addEventListener('click', closeReport);
    el('rpForm').addEventListener('submit', sendReport);
    dlg.addEventListener('close', function () { document.documentElement.classList.remove('dlg-open'); });
    dlg.addEventListener('click', function (e) { if (e.target === dlg) closeReport(); });   // 바깥(배경) 클릭
  }

  function boot(data){
    ALL = flatten(data || {});
    BYKEY = {};
    ALL.forEach(function (r) { BYKEY[r.key] = r; });
    computeLatest(ALL);
    computeFeatured(ALL);
    var site = data.site || {};
    if (site.instagram) {
      document.getElementById('igTop').href = site.instagram;
    }
    if (site.disclaimer) {
      document.getElementById('note').textContent =
        site.disclaimer + ' 응모는 각 기관 페이지에서 진행됩니다.';
    }
    document.getElementById('stamp').textContent =
      [stamp(site.updated_at), site.handle].filter(Boolean).join(' · ');
    bind();
    render();
  }

  fetch(DATA_URL, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(boot)
    .catch(function () {
      document.getElementById('list').innerHTML =
        '<p class="err">목록을 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.</p>';
    });
})();
</script>
</body>
</html>
